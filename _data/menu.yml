description:
  ca: |-
    A l'Entrepreneur treballem per tornar a l'essència de la cuina, oferint una gastronomia sincera i de qualitat; amb verdures de km 0, làctics i carns de pastura, ous ecològics de Calaf i peix salvatge. El nostre pa és de massa mare i fermentació lenta, i els olis que utilitzem són verges extra.

    Benvinguts a allò de sempre, a la cuina feta a foc lent, sense preses. Aquí el temps torna a ser un ingredient més: el que deixa reposar el pa, el que fa xup-xup a l'olla, el que convida a seure i a allargar la sobretaula. Cuinem com ho feien les nostres àvies, amb paciència, respecte i el gust de les coses ben fetes.
  en: |-
    At Entrepreneur, we work to bring cooking back to its essence, offering honest, quality food: local km 0 vegetables, dairy and grass-fed meats, organic eggs from Calaf and wild fish. Our bread is sourdough and slow-fermented, and the oils we use are extra virgin.

    Welcome to the way things have always been, to food slow-cooked over a low flame, with no rush. Here, time becomes an ingredient again: the time that lets the bread rest, that keeps the pot gently simmering, that invites you to sit down and stay at the table long after the meal. We cook the way our grandmothers did, with patience, respect and the taste of things done right.
  es: |-
    En Entrepreneur trabajamos para volver a la esencia de la cocina, ofreciendo una gastronomía sincera y de calidad: con verduras de km 0, lácteos y carnes de pasto, huevos ecológicos de Calaf y pescado salvaje. Nuestro pan es de masa madre y fermentación lenta, y los aceites que utilizamos son vírgenes extra.

    Bienvenidos a lo de siempre, a la cocina hecha a fuego lento, sin prisas. Aquí el tiempo vuelve a ser un ingrediente más: el que deja reposar el pan, el que hace chup-chup en la olla, el que invita a sentarse y a alargar la sobremesa. Cocinamos como lo hacían nuestras abuelas, con paciencia, respeto y el gusto por las cosas bien hechas.


